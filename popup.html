<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <style>

    body {
      width: 420px;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;
    }

    #contador {
      font-size: 42px;
      font-weight: bold;
      color: #198754;
      margin: 20px 0;
    }

    button {
      padding: 8px 16px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .informacoes {
      text-align: left;
      margin-bottom: 20px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 6px;
    }

    .informacao {
      margin: 5px 0;
      font-size: 13px;
    }

    .rotulo {
      font-weight: bold;
    }

    h3 {
      text-align: left;
      margin-bottom: 10px;
    }

    .historico-container {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th,
    td {
      padding: 8px 6px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #f5f5f5;
      position: sticky;
      top: 0;
    }

    .sem-registros {
      padding: 15px;
      color: #777;
      text-align: center;
    }

  </style>

</head>

<body>

  <h2>Contador SAFE</h2>

  <div id="contador">0</div>

  <button id="zerar">
    Zerar contador e histórico
  </button>


  <div class="informacoes">

    <div class="informacao">
      <span class="rotulo">Usuário logado:</span>
      <span id="usuario-logado">
        Não identificado
      </span>
    </div>

    <div class="informacao">
      <span class="rotulo">Repositório atual:</span>
      <span id="repositorio-atual">
        Não identificado
      </span>
    </div>

  </div>


  <h3>Histórico</h3>


  <div class="historico-container">

    <table>

      <thead>

        <tr>
          <th>Identificador Único</th>
          <th>Data/Hora</th>
        </tr>

      </thead>

      <tbody id="historico">
      </tbody>

    </table>

  </div>
  

  <script src="popup.js"></script>

</body>

</html>
