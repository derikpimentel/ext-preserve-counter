<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <title>SAFE-PreserveHub</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      width: 600px;
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    /*
    =====================================================
    CABEÇALHO
    =====================================================
    */

    .cabecalho {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .logo-safe {
      width: 56px;
      height: auto;
      object-fit: contain;
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }


    /*
    =====================================================
    PAINEL PRINCIPAL
    =====================================================
    */

    .painel-principal {
      display: flex;
      align-items: stretch;
      gap: 20px;
      background: white;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      margin-bottom: 15px;
    }


    /*
    =====================================================
    INFORMAÇÕES
    =====================================================
    */

    .informacoes-principais {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .informacao {
      margin-bottom: 10px;
      font-size: 13px;
      line-height: 1.4;
    }

    .informacao:last-child {
      margin-bottom: 0;
    }

    .informacao strong {
      display: inline-block;
      min-width: 125px;
    }

    .informacao span {
      word-break: break-word;
    }


    /*
    =====================================================
    CONTADOR
    =====================================================
    */

    .contador-principal {
      flex: 0 0 245px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-left: 1px solid #ddd;
      padding-left: 20px;
    }

    .contador-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    .contador-total {
      font-size: 42px;
      font-weight: bold;
      line-height: 1;
      margin-bottom: 4px;
    }

    .contadores-status {
      display: flex;
      justify-content: center;
      gap: 35px;
      width: 100%;
      border-top: 1px solid #ddd;
      padding-top: 10px;
      margin-top: 5px;
    }

    .status-box {
      text-align: center;
      min-width: 65px;
    }

    .status-valor {
      font-size: 22px;
      font-weight: bold;
      line-height: 1.1;
    }

    .status-label {
      font-size: 12px;
      color: #666;
      margin-top: 3px;
    }


    /*
    =====================================================
    BOTÃO EXPORTAR
    =====================================================
    */

    .botoes-acoes {
      margin-bottom: 15px;
    }

    #exportar-csv {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 6px;
      background: #2e7d32;
      color: white;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    #exportar-csv:hover {
      background: #1b5e20;
    }


    /*
    =====================================================
    HISTÓRICO
    =====================================================
    */

    .titulo-historico {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .tabela-container {
      background: white;
      border-radius: 8px;
      overflow: auto;
      max-height: 350px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th {
      position: sticky;
      top: 0;
      background: #eeeeee;
      padding: 9px 6px;
      text-align: left;
      border-bottom: 1px solid #ccc;
      white-space: nowrap;
    }

    td {
      padding: 8px 6px;
      border-bottom: 1px solid #eeeeee;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }


    /*
    =====================================================
    STATUS
    =====================================================
    */

    .status-aprovacao {
      font-weight: bold;
    }

    .status-verificar {
      font-weight: bold;
    }


    /*
    =====================================================
    SEM HISTÓRICO
    =====================================================
    */

    .sem-historico {
      text-align: center;
      color: #777;
      padding: 20px;
    }

  </style>

</head>

<body>

    <!--
    =====================================================
    CABEÇALHO
    =====================================================
    -->

    <div class="cabecalho">
        <img
            src="Logo_SAFE.png"
            alt="SAFE-PreserveHub"
            class="logo-safe"
        >
        <h2>SAFE-PreserveHub</h2>
    </div>


    <!--
    =====================================================
    PAINEL PRINCIPAL
    =====================================================
    -->

    <div class="painel-principal">


        <!--
        =================================================
        INFORMAÇÕES DO USUÁRIO
        =================================================
        -->

        <div class="informacoes-principais">

            <div class="informacao">
                <strong>Usuário logado:</strong>
                <span id="usuario-logado">
                    -
                </span>
            </div>

            <div class="informacao">
                <strong>Repositório atual:</strong>
                <span id="repositorio-atual">
                    -
                </span>
            </div>

            <div class="informacao">
                <strong>Data:</strong>
                <span id="data-atual">
                    -
                </span>
            </div>

        </div>


        <!--
        =================================================
        CONTADORES
        =================================================
        -->

        <div class="contador-principal">

            <div
                id="contador"
                class="contador-total"
            >
                0
            </div>

            <div class="contador-label">
                TOTAL DO DIA
            </div>


            <div class="contadores-status">


                <div class="status-box">

                    <div
                        id="contador-aprovacao"
                        class="status-valor"
                    >
                        0
                    </div>

                    <div class="status-label">
                        Aprovação
                    </div>

                </div>


                <div class="status-box">

                    <div
                        id="contador-verificar"
                        class="status-valor"
                    >
                        0
                    </div>

                    <div class="status-label">
                        Verificar
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!--
    =====================================================
    BOTÃO EXPORTAR
    =====================================================
    -->

    <div class="botoes-acoes">

        <button id="exportar-csv">
            Exportar CSV
        </button>

    </div>


    <!--
    =====================================================
    HISTÓRICO
    =====================================================
    -->

    <div class="titulo-historico">
        Histórico
    </div>


    <div class="tabela-container">

        <table>

            <thead>

                <tr>

                    <th>Status</th>

                    <th>Repositório</th>

                    <th>Identificador Único</th>

                    <th>Hora</th>

                </tr>

            </thead>


            <tbody id="historico">

                <tr>

                    <td
                        colspan="4"
                        class="sem-historico"
                    >
                        Nenhum registro encontrado.
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


  <script src="popup.js"></script>

</body>

</html>
